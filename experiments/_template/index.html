<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experiment Name</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f5bd3'/%3E%3Ccircle cx='11' cy='16' r='4' fill='none' stroke='white' stroke-width='2.5'/%3E%3Ccircle cx='22' cy='16' r='2.5' fill='white'/%3E%3C/svg%3E">
<style>
  /* Colors are tokens: light values on :root, dark values in the media query. */
  :root {
    --bg: #f3f4f7;
    --surface: #ffffff;
    --fg: #1b2130;
    --muted: #5e6779;
    --line: #d3d8e2;
    --accent: #2f5bd3;
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b;
      --surface: #1b2029;
      --fg: #e5e8ee;
      --muted: #98a1b1;
      --line: #343b48;
      --accent: #7f9dff;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 var(--font);
    padding-block: 32px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 24px; }
  .crumbs { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
  a { color: var(--accent); text-underline-offset: 2px; }
  header h1 { margin: 0; font-size: 26px; }
  header p { margin: 6px 0 0; color: var(--muted); max-width: 64ch; }
  .stage { padding: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <nav class="crumbs" aria-label="Breadcrumb"><a href="../../">UI Experiments</a> / Experiment name</nav>
    <h1>Experiment name</h1>
    <p>One or two sentences on the question this experiment explores.</p>
  </header>
  <main class="stage">
    <!-- Build the prototype here. -->
  </main>
</div>
<script>
  // Prototype behavior goes here.
</script>
</body>
</html>
